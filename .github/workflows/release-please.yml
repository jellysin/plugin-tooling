name: Shared release PR preparation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
          target-branch: main
          skip-github-release: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Explicitly dispatch release PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs || '[]' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          prs = json.loads(os.environ['RELEASE_PRS'])
          if not isinstance(prs, list) or len(prs) > 20:
              raise SystemExit('Unexpected release PR output')
          for pr in prs:
              branch = pr['headBranchName']
              if not branch.startswith('release-please--branches--main') or pr['baseBranchName'] != 'main':
                  raise SystemExit('Unexpected release PR branch')
              subprocess.run(['gh', 'workflow', 'run', 'ci.yml', '--repo', os.environ['GITHUB_REPOSITORY'], '--ref', branch], check=True, timeout=60)
          PY
