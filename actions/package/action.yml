name: Package Jellyfin plugin
description: Build a deterministic flat plugin ZIP, release metadata, checksums, and SPDX SBOM.
inputs:
  publish-directory:
    description: Directory containing the plugin-owned build outputs.
    required: true
  metadata-path:
    description: Plugin descriptor.
    default: plugin.json
  version-path:
    description: Three-part stable SemVer file.
    default: version.txt
  output-directory:
    description: Release artifact directory.
    default: dist
  tag:
    description: Exact checked-out release tag; omit only for CI packaging checks.
    default: ''
  nuget-lock-path:
    description: Production NuGet lock file; supply all three dependency inputs together.
    default: ''
  nuget-assets-path:
    description: Production project.assets.json from locked restore.
    default: ''
  runtime-dependencies-path:
    description: Reviewed declaration of host-provided runtime NuGet dependencies.
    default: ''
  global-json-path:
    description: Exact .NET SDK pin used for the dependency inventory.
    default: global.json
outputs:
  archive:
    description: Absolute path to the plugin ZIP.
    value: ${{ steps.package.outputs.archive }}
  directory:
    description: Absolute release artifact directory.
    value: ${{ steps.package.outputs.directory }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14.7'
    - id: package
      shell: bash
      env:
        TOOL_ROOT: ${{ github.action_path }}/../..
        PUBLISH_DIRECTORY: ${{ inputs.publish-directory }}
        METADATA_PATH: ${{ inputs.metadata-path }}
        VERSION_PATH: ${{ inputs.version-path }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        RELEASE_TAG: ${{ inputs.tag }}
        NUGET_LOCK_PATH: ${{ inputs.nuget-lock-path }}
        NUGET_ASSETS_PATH: ${{ inputs.nuget-assets-path }}
        RUNTIME_DEPENDENCIES_PATH: ${{ inputs.runtime-dependencies-path }}
        GLOBAL_JSON_PATH: ${{ inputs.global-json-path }}
      run: |
        args=(package --publish-directory "$PUBLISH_DIRECTORY" --metadata-path "$METADATA_PATH" --version-path "$VERSION_PATH" --output-directory "$OUTPUT_DIRECTORY")
        if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
        if [[ -n "$NUGET_LOCK_PATH" ]]; then args+=(--nuget-lock-path "$NUGET_LOCK_PATH"); fi
        if [[ -n "$NUGET_ASSETS_PATH" ]]; then args+=(--nuget-assets-path "$NUGET_ASSETS_PATH"); fi
        if [[ -n "$RUNTIME_DEPENDENCIES_PATH" ]]; then args+=(--runtime-dependencies-path "$RUNTIME_DEPENDENCIES_PATH"); fi
        args+=(--global-json-path "$GLOBAL_JSON_PATH")
        python "$TOOL_ROOT/tools.py" "${args[@]}"
