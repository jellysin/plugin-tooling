[project]
name = "jellysin-plugin-tooling"
version = "1.0.0" # x-release-please-version
description = "Build-time release and catalog tooling for JellySin plugins"
requires-python = "==3.14.7"
license = "EUPL-1.2"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C90", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60

[tool.coverage.run]
source = ["jellysin_tooling"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
